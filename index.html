<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلتي</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c2a38">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600&family=Amiri&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f1;--surface:#fff;--ink:#1c2a38;--mute:#6b7886;--line:#dde2de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a21;--surface:#1b2630;--ink:#e8eef3;--mute:#8d9aa7;--line:#2c3a46}}
:root[data-theme="dark"]{--bg:#121a21;--surface:#1b2630;--ink:#e8eef3;--mute:#8d9aa7;--line:#2c3a46}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Readex Pro",Tahoma,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:28px;margin:0}
.date{color:var(--mute);font-size:14px}
.prog{margin:14px 0 6px;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
#bar{height:100%;width:0;background:var(--ink);border-radius:8px;transition:width .3s}
#sum{font-size:14px;color:var(--mute);margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px;font-size:14px}
.chip i,h2 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--mute)}
#editg{background:none;border:0;color:var(--mute);font-size:13px;text-decoration:underline;padding:0 2px 8px}
h2{display:flex;align-items:center;gap:8px;font-size:15px;margin:18px 0 8px}
h2 span{margin-inline-start:auto;color:var(--mute);font-weight:400;font-size:13px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.top{display:flex;align-items:center;gap:12px}
.chk{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--c);background:transparent;color:transparent;font-size:20px;line-height:1}
.chk.on{background:var(--c);color:#fff}
.nm{flex:1;min-width:0}
.nm b{font-weight:600;display:block;overflow-wrap:anywhere}
.nm small{color:var(--mute);font-size:12px}
.ed{background:none;border:0;color:var(--mute);font-size:13px;padding:6px}
.week{display:flex;gap:6px;margin-top:10px;padding-inline-start:52px}
.row.off{opacity:.55}
.row.drag{position:relative;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.25);user-select:none}
.grip{background:none;border:0;color:var(--mute);font-size:22px;padding:4px 6px;touch-action:none;cursor:grab}
.chk:disabled,.dot:disabled{opacity:.35;cursor:default}
.days{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 16px}
.days button{padding:6px 10px;border-radius:16px;border:1.5px solid var(--line);background:transparent;font-size:13px}
.days button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lbl{font-size:14px;color:var(--mute)}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;font-size:20px;line-height:1;padding:0}
.nav button:disabled{opacity:.35;cursor:default}
.nav #today{width:auto;padding:0 12px;font-size:13px}
.nav .date{flex:1;min-width:110px}
.nav #pick{width:auto;margin:0;padding:6px;font-size:13px;flex:none}
.tabs{display:flex;gap:6px;margin:10px 0 14px;background:var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--surface);color:var(--ink)}
.nowbox{margin-bottom:12px;color:var(--mute);font-size:14px}
.nowbox b{color:var(--ink)}
.blk{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:12px;padding:12px;margin-bottom:8px}
.blk.cur{box-shadow:0 0 0 1.5px var(--c)}
.blk .tm{flex:none;width:80px;font-weight:600;font-size:14px;line-height:1.5}
.blk .tm small{color:var(--mute);font-weight:400}
.two{display:flex;gap:10px}
.two label{flex:1}
.tabs .te{flex:none;width:40px;font-size:16px}
#ord{margin-bottom:16px}
.ordr{display:flex;align-items:center;gap:8px;margin:4px 0}
.ordr span{flex:1}
.ordr button{width:36px;height:36px;border:1.5px solid var(--line);background:transparent;border-radius:10px}
.ordr button:disabled{opacity:.35;cursor:default}
.rbig{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 14px;margin-bottom:14px}
.rbig .num{font-size:64px;font-weight:600;line-height:1.1}
.rbig small{display:block;color:var(--mute);font-size:13px;margin-top:6px}
.rstat{display:flex;gap:8px;margin:6px 0 14px}
.rstat button{flex:1;padding:14px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.rstat .okb.on{background:#2f7d4f;border-color:#2f7d4f;color:#fff}
.rstat .slb.on{background:#c2433a;border-color:#c2433a;color:#fff}
.rcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 16px}
.rcal button{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:transparent;font-size:12px;padding:0;color:var(--mute)}
.rcal .c{background:#2f7d4f;border-color:#2f7d4f;color:#fff}
.rcal .s{background:#c2433a;border-color:#c2433a;color:#fff}
.rcal button:disabled{opacity:.3;cursor:default}
.ms{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ms.lock{opacity:.55}
.ms .bd{flex:none;width:40px;height:40px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:20px;color:var(--mute)}
.ms.got .bd{background:#b58a14;color:#fff}
.ms small{color:var(--mute);font-size:12px}
.rpri{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;margin-top:14px}
.tabs.sub{margin:0 0 14px}
.tabs.sub button{font-size:13px;padding:8px 2px}
textarea{display:block;width:100%;min-height:90px;margin-top:4px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.az{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.az.ok{border-color:#2f7d4f;box-shadow:0 0 0 1px #2f7d4f}
.azb{flex:1;display:flex;flex-direction:column;gap:6px;text-align:start;border:0;background:transparent;padding:14px}
.azt{font-size:17px;line-height:1.8}
.azn{color:var(--mute);font-size:13px}
.az.ok .azn{color:#2f7d4f;font-weight:600}
.azs{display:flex;flex-direction:column;justify-content:center;border-inline-start:1px solid var(--line)}
.du{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px}
.du p{margin:0 0 6px;font-size:18px;line-height:2;white-space:pre-wrap}
.du .r2{display:flex;align-items:center}
.du small{color:var(--mute);font-size:12px;flex:1}
.jr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.jh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.jh small{color:var(--mute);flex:1}
.jr p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.jr audio,.pi audio{width:100%;margin:6px 0}
.jr img,.pi img{display:block;max-width:100%;max-height:300px;border-radius:10px;margin:6px 0}
.pi{display:flex;align-items:center;gap:8px}
.pi audio,.pi img{flex:1;min-width:0}
.acts .recing{background:#c2433a;color:#fff;border-color:#c2433a}
.toast{position:fixed;inset:auto 16px 90px;max-width:420px;margin:0 auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;text-align:center;z-index:30}
.pl{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.pn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px}
.pt{flex:1;overflow-wrap:anywhere;white-space:pre-wrap}
.hello{margin:6px 0 4px;font-size:30px;font-weight:600;line-height:1.3}
.hsub{color:var(--mute);margin-bottom:18px}
.hc{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hc b{display:block;font-size:13px;color:var(--mute);font-weight:400;margin-bottom:4px}
.hc span{font-size:18px;font-weight:600}
.hc .prog{margin:10px 0 0}
.slg{font-family:Amiri,"Scheherazade New","Traditional Arabic",serif;font-size:26px;line-height:2;text-align:center;margin:0 0 18px;padding:14px 10px;border-block:1px solid var(--line)}
.slg small{display:block;font-family:"Readex Pro",Tahoma,sans-serif;font-size:13px;line-height:1.6;color:var(--mute)}
.dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:11px;color:var(--mute);padding:0}
.dot.on{background:var(--c);border-color:var(--c);color:#fff}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.bar{position:fixed;inset:auto 0 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
#addh{display:block;width:100%;max-width:528px;margin:0 auto;padding:14px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,400px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:12px}
input,select{display:block;width:100%;margin-top:4px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sw button.on{border-color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:transparent}
.acts .pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acts .del{margin-inline-start:auto;color:#c2433a;border-color:#c2433a}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>رحلتي</h1>
  <div class="tabs"><button id="tabM" class="te" aria-label="الرئيسية">⌂</button><button id="tabH" class="on">العادات</button><button id="tabP">الجدول</button><button id="tabR">التعافي</button><button id="tabE" class="te" aria-label="تعديل التبويبات">✎</button></div>
  <div id="mv" hidden></div>
  <div id="hv">
  <div class="nav"><button id="prev" aria-label="اليوم السابق">›</button><div class="date" id="date"></div><button id="next" aria-label="اليوم التالي">‹</button><input type="date" id="pick" aria-label="اختر تاريخًا"><button id="today">اليوم</button></div>
  <div class="prog"><div id="bar"></div></div>
  <div id="sum"></div>
  <div class="chips" id="chips"></div>
  <button id="editg" hidden>تعديل المجموعة</button>
  <div id="list"></div>
  </div>
  <div id="pv" hidden><div class="nowbox" id="now"></div><div id="blocks"></div></div>
  <div id="rv" hidden><div class="tabs sub" id="rsubs"><button data-rs="count" class="on">العدّاد</button><button data-rs="az">أذكار</button><button data-rs="du">دعاء</button><button data-rs="jr">يوميات</button></div><div id="rc"></div></div>
</div>
<div class="bar"><button id="addh">+ عادة جديدة</button></div>
<dialog id="dlg"><div id="dbody"></div></dialog>

<script>
const KEY='habits-v1';
const COLORS=['#1f6f78','#c2563a','#6a4fb3','#b58a14','#2f7d4f','#c23a6e','#3a6bc2'];
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const n=x=>x.toLocaleString('ar-EG');
let S=null,off=0,tab='habits';
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.habits){
  S={filter:'all',
    groups:[{id:'g1',name:'الصحة',color:COLORS[1]},{id:'g2',name:'التعلّم',color:COLORS[0]}],
    habits:[{id:uid(),name:'شرب الماء',g:'g1',days:{}},{id:uid(),name:'قراءة ١٠ صفحات',g:'g2',days:{}}]};
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
S.blocks=S.blocks||[];
S.names=S.names||{title:'رحلتي',h:'العادات',p:'الجدول'};
if(S.names.title==='عاداتي')S.names.title='رحلتي';
S.order=S.order||['h','p'];
if(!S.order.includes('r'))S.order.push('r');
S.names.r=S.names.r||'التعافي';
S.rec=S.rec||{start:null,log:{},got:[],rw:{}};
S.user=S.user||'مصطفى';
const SLG='قَالَ كَلَّا ۖ إِنَّ مَعِيَ رَبِّي سَيَهْدِينِ';
if(S.slogan===undefined)S.slogan=SLG;
const day=i=>{const d=new Date();d.setDate(d.getDate()-i);return d};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const grp=h=>S.groups.find(g=>g.id===h.g);
const WD=[6,0,1,2,3,4,5],DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const sched=(h,d)=>!h.d||h.d.includes(d.getDay());
const dayNames=a=>WD.filter(w=>a.includes(w)).map(w=>DN[w]).join('، ');
function streak(h){let c=0;for(let i=0;i<400;i++){const d=day(i);if(h.days[key(d)]){c++;continue}if(i===0||!sched(h,d))continue;break}return c}

function row(h){
  const g=grp(h),c=g?g.color:'#6b7886',t=key(day(off)),s=streak(h),now=sched(h,day(off));
  let dots='';
  for(let i=0;i<7;i++){const d=day(off+i),k=key(d);
    dots+=`<button class="dot ${h.days[k]?'on':''}" ${!h.days[k]&&!sched(h,d)?'disabled':''} style="--c:${c}" data-t="${h.id}" data-k="${k}" title="${d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}">${d.toLocaleDateString('ar-EG',{weekday:'narrow'})}</button>`}
  return `<div class="row ${now?'':'off'}" data-id="${h.id}"><div class="top">
    <button class="chk ${h.days[t]?'on':''}" ${now||h.days[t]?'':'disabled'} style="--c:${c}" data-t="${h.id}" data-k="${t}" aria-label="تم اليوم">✓</button>
    <div class="nm"><b>${esc(h.name)}</b><small>${s?'سلسلة '+n(s)+' يوم':'ابدأ سلسلتك اليوم'}</small>${h.d?`<small style="display:block">${dayNames(h.d)}${now?'':' (ليست هذا اليوم)'}</small>`:''}</div>
    <button class="ed" data-e="${h.id}">تعديل</button><button class="grip" data-id="${h.id}" aria-label="اسحب لإعادة الترتيب">≡</button></div>
    <div class="week">${dots}</div></div>`;
}
function sec(title,color,hs){
  if(!hs.length)return '';
  const t=key(day(off)),due=hs.filter(h=>sched(h,day(off))),d=due.filter(h=>h.days[t]).length;
  return `<section><h2><i style="background:${color}"></i>${esc(title)}<span>${n(d)}/${n(due.length)}</span></h2>${hs.map(row).join('')}</section>`;
}
function render(){
  if(S.filter!=='all'&&!S.groups.some(g=>g.id===S.filter))S.filter='all';
  const t=key(day(off)),all=S.filter==='all',lbl=off?'ذلك اليوم':'اليوم';
  const list=all?S.habits:S.habits.filter(h=>h.g===S.filter);
  const due=list.filter(h=>sched(h,day(off))),done=due.filter(h=>h.days[t]).length;
  $('#date').textContent=day(off).toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
  $('#pick').value=key(day(off));$('#pick').max=key(day(0));$('#next').disabled=!off;$('#today').hidden=!off;
  $('#sum').textContent=!list.length?'لا توجد عادات هنا بعد':due.length?`أنجزت ${n(done)} من ${n(due.length)} ${lbl}`:`لا توجد عادات مجدولة ${lbl}`;
  $('#bar').style.width=(due.length?done/due.length*100:0)+'%';
  $('#chips').innerHTML=`<button class="chip ${all?'on':''}" data-f="all">الكل</button>`+
    S.groups.map(g=>`<button class="chip ${S.filter===g.id?'on':''}" data-f="${g.id}"><i style="background:${g.color}"></i>${esc(g.name)}</button>`).join('')+
    `<button class="chip add" id="newg">+ مجموعة</button>`;
  $('#editg').hidden=all;
  const shown=all?S.groups:S.groups.filter(g=>g.id===S.filter);
  let html=shown.map(g=>sec(g.name,g.color,list.filter(h=>h.g===g.id))).join('');
  if(all)html+=sec('بدون مجموعة','var(--mute)',list.filter(h=>!grp(h)));
  $('#list').innerHTML=html||'<div class="empty">اضغط «عادة جديدة» لإضافة أول عادة.</div>';
}

const dlg=$('#dlg');
const openD=()=>dlg.showModal?dlg.showModal():dlg.setAttribute('open','');
const closeD=()=>dlg.close?dlg.close():dlg.removeAttribute('open');
function confirmDel(btn,fn){
  if(btn.dataset.s){fn()}else{btn.dataset.s=1;btn.textContent='تأكيد الحذف'}
}
function habitForm(hid){
  const h=S.habits.find(x=>x.id===hid);
  const cur=h?h.g:(S.filter!=='all'?S.filter:'');
  const sel=h&&h.d?h.d.slice():[0,1,2,3,4,5,6];
  $('#dbody').innerHTML=`<h3>${h?'تعديل العادة':'عادة جديدة'}</h3>
  <label>الاسم<input id="fn" maxlength="60" value="${h?esc(h.name):''}"></label>
  <label>المجموعة<select id="fg"><option value="">بدون مجموعة</option>${S.groups.map(g=>`<option value="${g.id}" ${cur===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label>
  <div class="lbl">أيام التكرار</div><div class="days" id="days">${WD.map(w=>`<button data-w="${w}" class="${sel.includes(w)?'on':''}">${DN[w]}</button>`).join('')}</div>
  <div class="acts"><button class="pri" id="ok">حفظ</button><button id="cx">إلغاء</button>${h?'<button class="del" id="rm">حذف</button>':''}</div>`;
  $('#cx').onclick=closeD;
  $('#ok').onclick=()=>{
    const name=$('#fn').value.trim();if(!name){$('#fn').focus();return}
    const dd=sel.length&&sel.length<7?sel.slice():null;
    if(h){h.name=name;h.g=$('#fg').value;if(dd)h.d=dd;else delete h.d}else{const nh={id:uid(),name,g:$('#fg').value,days:{}};if(dd)nh.d=dd;S.habits.push(nh)}
    save();render();closeD();
  };
  if(h)$('#rm').onclick=e=>confirmDel(e.target,()=>{S.habits=S.habits.filter(x=>x!==h);save();render();closeD()});

async function shareJr(e){
  const d=new Date(e.ts);
  const text=d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})+' - '+d.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})+(e.note?'\n\n'+e.note:'');
  let files=[];
  try{
    let i=0;
    for(const m of e.media){
      const b=await mGet(m.id);if(!b)continue;i++;
      const ty=b.type||(m.k==='i'?'image/jpeg':'audio/webm');
      const ext=m.k==='i'?'jpg':ty.includes('mp4')?'m4a':ty.includes('ogg')?'ogg':ty.includes('mpeg')?'mp3':'webm';
      files.push(new File([b],(m.k==='i'?'photo':'audio')+i+'.'+ext,{type:ty}));
    }
  }catch(x){files=[]}
  const data={text};
  if(files.length&&navigator.canShare&&navigator.canShare({files}))data.files=files;
  const lost=files.length&&!data.files;
  if(navigator.share){
    try{
      await navigator.share(data);
      if(lost)toast('اتبعت النص بس، جهازك مش بيدعم مشاركة المرفقات من هنا');
      return;
    }catch(x){if(x&&x.name==='AbortError')return}
  }
  try{await navigator.clipboard.writeText(text)}catch(x){}
  window.open('https://t.me/share/url?url=%20&text='+encodeURIComponent(text),'_blank');
  toast(files.length?'اتفتح تيليجرام بالنص. المرفقات مش بتتبعت من هنا.':'اتفتح تيليجرام بالنص، ولو ما ظهرش اتنسخ وتقدر تلصقه.');
}
async function tgApi(m,fd){
  const r=await fetch('https://api.telegram.org/bot'+S.tg.token+'/'+m,{method:'POST',body:fd});
  const j=await r.json().catch(()=>({}));
  if(!j.ok){const er=new Error(j.description||'خطأ من تيليجرام');er.api=1;throw er}
}
async function tgSend(e){
  const d=new Date(e.ts),chat=S.tg.chat;
  const text=(d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})+' - '+d.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})+(e.note?'\n\n'+e.note:'')).slice(0,4096);
  let fd=new FormData();fd.append('chat_id',chat);fd.append('text',text);
  await tgApi('sendMessage',fd);
  let i=0;
  for(const m of e.media){
    const b=await mGet(m.id);if(!b)continue;i++;
    const ty=b.type||'',img=m.k==='i';
    const meth=img?'sendPhoto':ty.includes('ogg')?'sendVoice':(ty.includes('mp4')||ty.includes('mpeg'))?'sendAudio':'sendDocument';
    const fk=img?'photo':meth==='sendVoice'?'voice':meth==='sendAudio'?'audio':'document';
    const ext=img?'jpg':ty.includes('ogg')?'ogg':ty.includes('mp4')?'m4a':ty.includes('mpeg')?'mp3':'webm';
    fd=new FormData();fd.append('chat_id',chat);fd.append(fk,b,(img?'photo':'audio')+i+'.'+ext);
    await tgApi(meth,fd);
  }
}

let drag=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip');if(!g)return;
  e.preventDefault();
  const row=g.closest('.row');
  drag={row,y:e.clientY};
  row.classList.add('drag');
  g.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  const row=drag.row;
  let dy=e.clientY-drag.y;
  row.style.transform=`translateY(${dy}px)`;
  const r=row.getBoundingClientRect(),c=r.top+r.height/2;
  const nx=row.nextElementSibling,pv=row.previousElementSibling;
  const mid=el=>{const q=el.getBoundingClientRect();return q.top+q.height/2};
  if(nx&&nx.classList.contains('row')&&c>mid(nx))nx.after(row);
  else if(pv&&pv.classList.contains('row')&&c<mid(pv))pv.before(row);
  else return;
  dy-=row.getBoundingClientRect().top-r.top;
  drag.y=e.clientY-dy;
  row.style.transform=`translateY(${dy}px)`;
});
function endDrag(){
  if(!drag)return;
  const row=drag.row,box=row.parentElement;drag=null;

}
